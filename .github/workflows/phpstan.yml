name: PHPStan

on:
    push:
        paths:
            - '**.php'
            - 'phpstan.neon.dist'
    pull_request:
        paths:
            - '**.php'
            - 'phpstan.neon.dist'

jobs:
    phpstan:
        name: phpstan
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
          COMPOSER_NO_INTERACTION: 1
        steps:
            - uses: actions/checkout@v6

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.4
                  coverage: none

            - name: Install composer dependencies
              uses: ramsey/composer-install@v3

            - name: Install dependencies
              run: |
                  composer update --prefer-dist --no-suggest

            - name: Run PHPStan
              run: |
                  ./vendor/bin/phpstan --error-format=github
